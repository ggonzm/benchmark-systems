# This workflow will upload a Python Package to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Publish Python Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing published release tag (for example, v1.1.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  release-build:
    if: >-
      github.repository == 'ggonzm/benchmark-systems' &&
      (github.event_name == 'release' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install release tools
        run: |
          python -m pip install "pdm==2.29.7" twine "readme-renderer[md]"
          python -m pip check
          pdm --version

      - name: Verify existing published release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "false"

      - name: Verify release belongs to main
        run: git merge-base --is-ancestor HEAD origin/main

      - name: Install locked dependencies
        run: |
          pdm lock --check
          pdm -v sync -G dev -G sym

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          pdm run python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from benchmark_systems import __version__

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert version == __version__, "Package versions do not match"
          assert os.environ["RELEASE_TAG"] == f"v{version}", "Release tag must be v<package version>"
          PY

      - name: Run tests
        run: pdm run pytest

      - name: Build and validate distributions
        run: |
          pdm build
          python -m twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  pypi-publish:
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/benchmark-systems/

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  release-assets:
    needs: pypi-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Attach distributions to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
